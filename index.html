<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ফসলের ডাক্তার</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── Design tokens ── */
:root {
  --g900: #0d3320;
  --g700: #1b5e3b;
  --g600: #2d7a56;
  --g400: #4ead7a;
  --g100: #e4f5ec;
  --g50:  #f0faf5;
  --amber: #d97706;
  --amber-bg: #fef3c7;
  --amber-border: #fcd34d;
  --red: #dc2626;
  --red-bg: #fee2e2;
  --bg:      #f2f7f4;
  --surface: #ffffff;
  --surface2: #f8fcf9;
  --border:  #cce3d6;
  --text:    #142a1e;
  --muted:   #567060;
  --white:   #ffffff;
  --shadow:  0 2px 12px rgba(0,0,0,.10);
  --r:       12px;
  --rsm:     8px;
  --rpill:   999px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:      #0a1c10;
    --surface: #122118;
    --surface2: #1a2e20;
    --border:  #25422e;
    --text:    #dff0e5;
    --muted:   #7aaa8c;
    --g50:     #122118;
    --g100:    #1a2e20;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg:      #0a1c10;
  --surface: #122118;
  --surface2: #1a2e20;
  --border:  #25422e;
  --text:    #dff0e5;
  --muted:   #7aaa8c;
  --g50:     #122118;
  --g100:    #1a2e20;
  color-scheme: dark;
}

/* ── Reset ── */
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Inter', 'Noto Sans Bengali', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ── Utility ── */
[hidden] { display: none !important; }

/* ════════════════════════════════
   LOGIN PAGE
════════════════════════════════ */
.login-page {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 24px 20px;
  background: linear-gradient(150deg, var(--g900) 0%, var(--g700) 55%, var(--g600) 100%);
  position: relative;
  overflow: hidden;
}

/* leaf decoration */
.login-page::before,
.login-page::after {
  content: '';
  position: absolute;
  border-radius: 50%;
  opacity: .08;
  background: white;
}
.login-page::before { width: 320px; height: 320px; top: -80px; right: -80px; }
.login-page::after  { width: 200px; height: 200px; bottom: -60px; left: -60px; }

.login-card {
  background: var(--surface);
  border-radius: 20px;
  padding: 40px 32px 36px;
  width: 100%;
  max-width: 400px;
  box-shadow: 0 20px 60px rgba(0,0,0,.3);
  position: relative;
  z-index: 1;
}

.login-brand {
  text-align: center;
  margin-bottom: 32px;
}
.brand-icon {
  width: 68px; height: 68px;
  border-radius: 18px;
  background: linear-gradient(135deg, var(--g700), var(--g400));
  display: flex; align-items: center; justify-content: center;
  font-size: 34px;
  margin: 0 auto 14px;
  box-shadow: 0 8px 24px rgba(27,94,59,.35);
}
.brand-name {
  font-size: 22px; font-weight: 700;
  font-family: 'Noto Sans Bengali', 'Inter', sans-serif;
  color: var(--g700);
  line-height: 1.2;
}
.brand-sub {
  font-size: 12px; color: var(--muted);
  margin-top: 4px; letter-spacing: .03em;
}

.form-label {
  display: block;
  font-size: 12px; font-weight: 600;
  color: var(--muted); letter-spacing: .05em; text-transform: uppercase;
  margin-bottom: 6px;
}
.form-input {
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid var(--border);
  border-radius: var(--rsm);
  font-size: 15px; color: var(--text);
  background: var(--surface);
  outline: none;
  font-family: inherit;
  transition: border-color .15s, box-shadow .15s;
  margin-bottom: 16px;
}
.form-input:focus {
  border-color: var(--g600);
  box-shadow: 0 0 0 3px rgba(45,122,86,.12);
}

.btn-primary {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, var(--g700), var(--g600));
  color: white;
  border: none; border-radius: var(--rsm);
  font-size: 15px; font-weight: 700;
  cursor: pointer; font-family: inherit;
  transition: opacity .15s, transform .1s;
  margin-top: 4px;
  letter-spacing: .02em;
}
.btn-primary:disabled { opacity: .55; cursor: not-allowed; }
.btn-primary:hover:not(:disabled) { opacity: .9; }
.btn-primary:active:not(:disabled) { transform: scale(.98); }

.login-error {
  background: var(--red-bg); color: var(--red);
  border-radius: var(--rsm); padding: 10px 14px;
  font-size: 13px; margin-top: 12px;
  border-left: 3px solid var(--red);
}

/* ════════════════════════════════
   CHAT APP SHELL
════════════════════════════════ */
.chat-app {
  display: flex; flex-direction: column;
  height: 100vh; height: 100dvh;
  max-width: 760px;
  margin: 0 auto;
}

/* ── Header ── */
.chat-header {
  background: var(--g700);
  display: flex; align-items: center;
  gap: 12px;
  padding: 12px 16px;
  padding-top: calc(12px + env(safe-area-inset-top, 0px));
  flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(0,0,0,.2);
}
.hdr-icon {
  width: 38px; height: 38px;
  background: rgba(255,255,255,.18);
  border-radius: 11px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; flex-shrink: 0;
}
.hdr-info { flex: 1; min-width: 0; }
.hdr-name {
  font-size: 16px; font-weight: 700; color: white;
  font-family: 'Noto Sans Bengali','Inter',sans-serif;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.hdr-status {
  font-size: 11px; color: rgba(255,255,255,.7);
  display: flex; align-items: center; gap: 5px; margin-top: 2px;
}
.status-dot {
  width: 7px; height: 7px; background: #4aea7a;
  border-radius: 50%; flex-shrink: 0;
  box-shadow: 0 0 6px #4aea7a;
}
.hdr-btn {
  background: rgba(255,255,255,.15);
  border: none; color: white;
  width: 36px; height: 36px;
  border-radius: 9px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 17px; flex-shrink: 0;
  transition: background .15s;
}
.hdr-btn:hover { background: rgba(255,255,255,.28); }

/* ── Messages ── */
.messages {
  flex: 1; overflow-y: auto;
  padding: 20px 16px;
  display: flex; flex-direction: column;
  gap: 18px;
  scroll-behavior: smooth;
}
.messages::-webkit-scrollbar { width: 4px; }
.messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

/* Welcome */
.welcome {
  text-align: center;
  padding: 40px 20px 20px;
  color: var(--muted);
}
.welcome-icon { font-size: 52px; margin-bottom: 16px; }
.welcome h3 {
  font-size: 18px; font-weight: 700; color: var(--text);
  font-family: 'Noto Sans Bengali','Inter',sans-serif;
  margin-bottom: 8px;
}
.welcome p { font-size: 13px; line-height: 1.65; max-width: 280px; margin: 0 auto; }

.chip-row {
  display: flex; flex-wrap: wrap; gap: 8px;
  justify-content: center; margin-top: 20px;
}
.chip {
  padding: 7px 14px;
  border: 1.5px solid var(--border);
  border-radius: var(--rpill);
  font-size: 12px; font-weight: 500;
  color: var(--g700); background: var(--g50);
  cursor: pointer; font-family: inherit;
  transition: background .15s, border-color .15s;
  font-family: 'Noto Sans Bengali','Inter',sans-serif;
}
.chip:hover { background: var(--g100); border-color: var(--g400); }

/* Message rows */
.msg { display: flex; gap: 10px; align-items: flex-end; }
.msg.user { flex-direction: row-reverse; }

.avatar {
  width: 30px; height: 30px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; flex-shrink: 0;
}
.msg.bot .avatar { background: var(--g700); color: white; }
.msg.user .avatar { background: var(--amber); color: white; font-weight: 700; }

.msg-wrap { max-width: 78%; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.msg.user .msg-wrap { align-items: flex-end; }

.disease-tag {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--amber-bg); color: #92400e;
  border: 1px solid var(--amber-border);
  border-radius: var(--rpill);
  padding: 3px 10px; font-size: 11px; font-weight: 600;
  letter-spacing: .02em;
  align-self: flex-start;
}

.img-preview-msg {
  width: 180px; border-radius: var(--rsm);
  overflow: hidden; border: 2px solid var(--border);
  align-self: flex-end;
}
.img-preview-msg img { width: 100%; display: block; }

.bubble {
  padding: 11px 15px;
  border-radius: var(--r);
  font-size: 14px; line-height: 1.65;
  word-break: break-word;
  font-family: 'Noto Sans Bengali','Inter',sans-serif;
}
.msg.bot .bubble {
  background: var(--surface);
  border: 1px solid var(--border);
  border-bottom-left-radius: 4px;
  color: var(--text);
  box-shadow: var(--shadow);
}
.msg.user .bubble {
  background: var(--g700);
  color: white;
  border-bottom-right-radius: 4px;
}

/* Typing indicator */
.typing-wrap { display: flex; gap: 10px; align-items: flex-end; }
.typing-bubble {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r); border-bottom-left-radius: 4px;
  padding: 14px 18px;
  display: flex; gap: 5px; align-items: center;
  box-shadow: var(--shadow);
}
.dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--muted);
  animation: bounce 1.3s infinite ease-in-out;
}
.dot:nth-child(2) { animation-delay: .2s; }
.dot:nth-child(3) { animation-delay: .4s; }
@keyframes bounce {
  0%,60%,100% { transform: translateY(0); }
  30%          { transform: translateY(-8px); }
}

/* ── Input area ── */
.input-area {
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 10px 16px;
  padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  flex-shrink: 0;
}

.img-attach-preview {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px;
  background: var(--g50);
  border: 1px solid var(--border);
  border-radius: var(--rsm);
  margin-bottom: 8px;
}
.img-attach-preview img {
  width: 46px; height: 46px;
  object-fit: cover; border-radius: 7px; flex-shrink: 0;
}
.attach-info { flex: 1; min-width: 0; }
.attach-info .attach-name {
  font-size: 12px; font-weight: 600; color: var(--text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.attach-info .attach-hint {
  font-size: 11px; color: var(--g600); margin-top: 2px;
}
.btn-rm {
  background: none; border: none;
  cursor: pointer; color: var(--muted);
  font-size: 20px; padding: 2px; flex-shrink: 0;
  line-height: 1;
  transition: color .15s;
}
.btn-rm:hover { color: var(--red); }

.input-row {
  display: flex; align-items: flex-end; gap: 8px;
}
.input-row textarea {
  flex: 1; min-width: 0;
  padding: 10px 14px;
  border: 1.5px solid var(--border);
  border-radius: var(--rpill);
  font-size: 14px; color: var(--text);
  background: var(--surface2);
  resize: none; outline: none;
  font-family: 'Noto Sans Bengali','Inter',sans-serif;
  line-height: 1.5; max-height: 110px;
  overflow-y: auto;
  transition: border-color .15s;
}
.input-row textarea:focus { border-color: var(--g600); }
.input-row textarea::placeholder { color: var(--muted); }

.btn-round {
  width: 42px; height: 42px; border-radius: 50%;
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 19px; flex-shrink: 0;
  transition: opacity .15s, transform .1s;
}
.btn-round:active { transform: scale(.93); }
.btn-attach-rd {
  background: var(--g50);
  border: 1.5px solid var(--border);
  color: var(--g700);
}
.btn-attach-rd:hover { background: var(--g100); }
.btn-send-rd {
  background: var(--g700);
  color: white;
  box-shadow: 0 4px 12px rgba(27,94,59,.35);
}
.btn-send-rd:disabled { opacity: .4; cursor: not-allowed; }
.btn-send-rd:hover:not(:disabled) { opacity: .88; }

#file-input { display: none; }

/* ── Scrollbar ── */
.messages { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }

/* ── Mobile adjustments ── */
@media (max-width: 480px) {
  .login-card { padding: 32px 22px 28px; }
  .msg-wrap { max-width: 88%; }
}
</style>
</head>
<body>

<!-- ══════════ LOGIN PAGE ══════════ -->
<div class="login-page" id="loginPage">
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-icon">🌿</div>
      <div class="brand-name">ফসলের ডাক্তার</div>
      <div class="brand-sub">AI Crop Disease Detection · Bangladesh</div>
    </div>

    <label class="form-label" for="email">Email</label>
    <input class="form-input" type="email" id="email" placeholder="admin@gmail.com" autocomplete="username">

    <label class="form-label" for="password">Password</label>
    <input class="form-input" type="password" id="password" placeholder="••••••••" autocomplete="current-password">

    <button class="btn-primary" id="loginBtn" onclick="doLogin()">Sign In</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- ══════════ CHAT APP ══════════ -->
<div class="chat-app" id="chatApp" hidden>

  <!-- Header -->
  <header class="chat-header">
    <div class="hdr-icon">🌿</div>
    <div class="hdr-info">
      <div class="hdr-name">ফসলের ডাক্তার</div>
      <div class="hdr-status">
        <span class="status-dot"></span>
        <span id="userLabel">AI Crop Doctor</span>
      </div>
    </div>
    <button class="hdr-btn" onclick="newChat()" title="New chat">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="hdr-btn" onclick="doLogout()" title="Logout">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
  </header>

  <!-- Messages -->
  <div class="messages" id="messages">
    <div class="welcome" id="welcome">
      <div class="welcome-icon">🌾</div>
      <h3>আপনার ফসলের সমস্যা জানান</h3>
      <p>একটি ছবি আপলোড করুন অথবা আপনার ফসলের রোগের বিষয়ে জিজ্ঞেস করুন। আমি সাহায্য করব।</p>
      <div class="chip-row">
        <button class="chip" onclick="quickAsk('আমার ধানের পাতায় বাদামী দাগ হচ্ছে')">🌾 ধানের পাতায় দাগ</button>
        <button class="chip" onclick="quickAsk('গমে হলুদ মরিচা দেখা যাচ্ছে')">🌿 গমে মরিচা রোগ</button>
        <button class="chip" onclick="quickAsk('আমার আলুর পাতা কালো হয়ে যাচ্ছে')">🥔 আলুর পাতা কালো</button>
        <button class="chip" onclick="quickAsk('ভুট্টা গাছে কমলা মরিচা')">🌽 ভুট্টার মরিচা</button>
      </div>
    </div>
  </div>

  <!-- Input -->
  <div class="input-area">
    <!-- Image attach preview -->
    <div class="img-attach-preview" id="attachPreview" hidden>
      <img id="attachThumb" src="" alt="">
      <div class="attach-info">
        <div class="attach-name" id="attachName"></div>
        <div class="attach-hint">🔍 রোগ শনাক্ত হবে</div>
      </div>
      <button class="btn-rm" onclick="removeAttach()">×</button>
    </div>

    <div class="input-row">
      <button class="btn-round btn-attach-rd" onclick="document.getElementById('file-input').click()" title="Upload leaf photo">
        📷
      </button>
      <input type="file" id="file-input" accept="image/*" onchange="onFileSelect(event)">
      <textarea id="msgInput" rows="1"
        placeholder="আপনার ফসলের সমস্যা লিখুন..."
        onkeydown="handleKey(event)"
        oninput="autoResize(this)"
      ></textarea>
      <button class="btn-round btn-send-rd" id="sendBtn" onclick="sendMessage()">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(45deg);margin-top:-2px"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
const API = 'http://localhost:8000';

/* ── State ── */
let token = '';
let history = [];
let attachedFile = null;
let isLoading = false;

/* ── Boot ── */
(function init() {
  try { token = localStorage.getItem('fd_token') || ''; } catch(e){}
  if (token) showChat();
})();

/* ── Auth ── */
async function doLogin() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('loginBtn');
  const errEl = document.getElementById('loginError');

  errEl.hidden = true;
  if (!email || !password) { showError('Email এবং password দিন।'); return; }

  btn.disabled = true;
  btn.textContent = 'Signing in…';

  try {
    const res = await fetch(`${API}/api/v1/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Login failed');
    token = data.access_token;
    try { localStorage.setItem('fd_token', token); } catch(e){}
    showChat();
  } catch (e) {
    showError(e.message || 'সংযোগ ব্যর্থ হয়েছে। Backend চালু আছে কিনা দেখুন।');
    btn.disabled = false;
    btn.textContent = 'Sign In';
  }
}

function showError(msg) {
  const el = document.getElementById('loginError');
  el.textContent = msg;
  el.hidden = false;
}

function doLogout() {
  token = '';
  history = [];
  try { localStorage.removeItem('fd_token'); } catch(e){}
  document.getElementById('chatApp').hidden = true;
  document.getElementById('loginPage').hidden = false;
  document.getElementById('loginError').hidden = true;
  document.getElementById('password').value = '';
}

function showChat() {
  document.getElementById('loginPage').hidden = true;
  document.getElementById('chatApp').hidden = false;
  // decode email from token for display
  try {
    const payload = JSON.parse(atob(token.split('.')[1]));
    document.getElementById('userLabel').textContent = 'সংযুক্ত';
  } catch(e){}
}

/* ── File attach ── */
function onFileSelect(e) {
  const file = e.target.files[0];
  if (!file) return;
  attachedFile = file;
  const url = URL.createObjectURL(file);
  document.getElementById('attachThumb').src = url;
  document.getElementById('attachName').textContent = file.name;
  document.getElementById('attachPreview').hidden = false;
  e.target.value = '';
}

function removeAttach() {
  attachedFile = null;
  document.getElementById('attachPreview').hidden = true;
  document.getElementById('attachThumb').src = '';
}

/* ── Sending ── */
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 110) + 'px';
}

async function sendMessage() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if ((!text && !attachedFile) || isLoading) return;

  isLoading = true;
  document.getElementById('sendBtn').disabled = true;
  document.getElementById('welcome').hidden = true;

  const file = attachedFile;
  const userText = text;
  input.value = ''; input.style.height = 'auto';
  removeAttach();

  /* Render user bubble */
  appendUserMsg(userText, file);
  history.push({ role: 'user', content: userText || '📷 ছবি পাঠালাম' });

  /* Show typing */
  const typingId = appendTyping();

  try {
    const fd = new FormData();
    fd.append('message', userText);
    fd.append('history', JSON.stringify(history.slice(0, -1)));
    if (file) fd.append('image', file, file.name);

    const res = await fetch(`${API}/api/v1/chat/`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${token}` },
      body: fd
    });

    removeEl(typingId);

    if (res.status === 401) { doLogout(); return; }
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || `Error ${res.status}`);
    }

    const data = await res.json();
    appendBotMsg(data);
    history.push({ role: 'assistant', content: data.reply });

  } catch (e) {
    removeEl(typingId);
    appendBotMsg({ reply: `⚠️ সমস্যা হয়েছে: ${e.message}`, sources_used: false });
  }

  isLoading = false;
  document.getElementById('sendBtn').disabled = false;
  scrollBottom();
}

function quickAsk(text) {
  document.getElementById('msgInput').value = text;
  sendMessage();
}

function newChat() {
  history = [];
  document.getElementById('messages').innerHTML = '';
  document.getElementById('messages').appendChild(buildWelcome());
}

/* ── DOM helpers ── */
function buildWelcome() {
  const el = document.createElement('div');
  el.className = 'welcome'; el.id = 'welcome';
  el.innerHTML = `
    <div class="welcome-icon">🌾</div>
    <h3>আপনার ফসলের সমস্যা জানান</h3>
    <p>একটি ছবি আপলোড করুন অথবা আপনার ফসলের রোগের বিষয়ে জিজ্ঞেস করুন। আমি সাহায্য করব।</p>
    <div class="chip-row">
      <button class="chip" onclick="quickAsk('আমার ধানের পাতায় বাদামী দাগ হচ্ছে')">🌾 ধানের পাতায় দাগ</button>
      <button class="chip" onclick="quickAsk('গমে হলুদ মরিচা দেখা যাচ্ছে')">🌿 গমে মরিচা রোগ</button>
      <button class="chip" onclick="quickAsk('আমার আলুর পাতা কালো হয়ে যাচ্ছে')">🥔 আলুর পাতা কালো</button>
      <button class="chip" onclick="quickAsk('ভুট্টা গাছে কমলা মরিচা')">🌽 ভুট্টার মরিচা</button>
    </div>`;
  return el;
}

function appendUserMsg(text, file) {
  const wrap = div('msg user');
  const msgWrap = div('msg-wrap');

  if (file) {
    const imgBox = div('img-preview-msg');
    const img = document.createElement('img');
    img.src = URL.createObjectURL(file);
    imgBox.appendChild(img);
    msgWrap.appendChild(imgBox);
  }
  if (text) {
    const b = div('bubble');
    b.textContent = text;
    msgWrap.appendChild(b);
  }

  const av = div('avatar');
  av.textContent = '👤';
  wrap.appendChild(msgWrap);
  wrap.appendChild(av);
  msgs().appendChild(wrap);
  scrollBottom();
}

function appendBotMsg(data) {
  const wrap = div('msg bot');
  const av = div('avatar');
  av.textContent = '🌿';

  const msgWrap = div('msg-wrap');

  if (data.disease_detected) {
    const tag = div('disease-tag');
    const conf = data.confidence ? ` · ${(data.confidence*100).toFixed(0)}%` : '';
    tag.innerHTML = `🔬 <span>${data.disease_detected.replace(/_/g,' ')}${conf}</span>`;
    msgWrap.appendChild(tag);
  }

  const b = div('bubble');
  b.textContent = data.reply;
  msgWrap.appendChild(b);

  wrap.appendChild(av);
  wrap.appendChild(msgWrap);
  msgs().appendChild(wrap);
}

function appendTyping() {
  const id = 'typing-' + Date.now();
  const wrap = div('typing-wrap');
  wrap.id = id;
  const av = div('avatar');
  av.textContent = '🌿';
  const bubble = div('typing-bubble');
  bubble.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
  wrap.appendChild(av);
  wrap.appendChild(bubble);
  msgs().appendChild(wrap);
  scrollBottom();
  return id;
}

function removeEl(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}

function div(cls) {
  const el = document.createElement('div');
  el.className = cls;
  return el;
}

function msgs() { return document.getElementById('messages'); }
function scrollBottom() {
  const m = msgs();
  requestAnimationFrame(() => { m.scrollTop = m.scrollHeight; });
}

/* ── Enter on login ── */
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
  document.getElementById('email').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('password').focus();
  });
});
</script>
