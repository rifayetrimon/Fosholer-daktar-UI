<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>ফসলের ডাক্তার</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ── Tokens ── */
:root {
  --sidebar: #171717;
  --sidebar-hover: #262626;
  --main: #212121;
  --surface: #2f2f2f;
  --surface2: #3d3d3d;
  --border: #3d3d3d;
  --text: #ececec;
  --muted: #8e8ea0;
  --accent: #10a37f;
  --accent-hover: #0d8c6d;
  --user-bubble: #2f2f2f;
  --danger: #ef4444;
  color-scheme: dark;
}

/* ── Reset ── */
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Inter', 'Noto Sans Bengali', system-ui, sans-serif;
  background: var(--main);
  color: var(--text);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
button { font-family: inherit; cursor: pointer; }
textarea, input { font-family: inherit; }

/* ════════════════════════════════
   LOGIN PAGE
════════════════════════════════ */
.login-page {
  display: flex; align-items: center; justify-content: center;
  height: 100vh; height: 100dvh;
  background: var(--main);
  padding: 24px 20px;
}
.login-card { width: 100%; max-width: 380px; }

.login-brand {
  text-align: center; margin-bottom: 32px;
}
.brand-icon {
  width: 48px; height: 48px; background: var(--accent);
  border-radius: 12px; display: flex; align-items: center;
  justify-content: center; font-size: 24px; margin: 0 auto 16px;
}
.brand-name {
  font-size: 24px; font-weight: 600; color: var(--text);
  font-family: 'Noto Sans Bengali', 'Inter', sans-serif;
}
.brand-sub { font-size: 13px; color: var(--muted); margin-top: 4px; }

.login-title { font-size: 20px; font-weight: 600; text-align: center; margin-bottom: 24px; }

.field { margin-bottom: 12px; }
.field label {
  display: block; font-size: 13px; color: var(--muted);
  margin-bottom: 6px; font-weight: 500;
}
.field input {
  width: 100%; padding: 12px 14px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; font-size: 15px; color: var(--text);
  outline: none; transition: border-color .15s;
}
.field input:focus { border-color: var(--accent); }
.field input::placeholder { color: var(--muted); }

.btn-login {
  width: 100%; padding: 13px;
  background: var(--accent); color: white;
  border: none; border-radius: 8px;
  font-size: 15px; font-weight: 600;
  margin-top: 8px; transition: background .15s;
}
.btn-login:hover:not(:disabled) { background: var(--accent-hover); }
.btn-login:disabled { opacity: .5; cursor: not-allowed; }

.login-err {
  margin-top: 12px; padding: 10px 14px;
  background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.3);
  color: #fca5a5; border-radius: 8px; font-size: 13px;
}

/* ════════════════════════════════
   APP SHELL
════════════════════════════════ */
.app { display: flex; height: 100vh; height: 100dvh; }

/* Overlay */
.overlay {
  display: none; position: fixed; inset: 0; z-index: 40;
  background: rgba(0,0,0,.5);
}
.overlay.show { display: block; }

/* ── Sidebar ── */
.sidebar {
  width: 260px; flex-shrink: 0;
  background: var(--sidebar);
  display: flex; flex-direction: column;
  height: 100%; z-index: 50;
  transition: transform .25s ease;
}
.sidebar-top {
  padding: 12px 10px 8px;
  display: flex; gap: 6px; align-items: center;
}
.btn-new-chat {
  flex: 1; display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; background: none; border: none;
  color: var(--text); border-radius: 8px; font-size: 14px;
  font-weight: 500; transition: background .15s; text-align: left;
}
.btn-new-chat:hover { background: var(--sidebar-hover); }

.btn-icon-sm {
  width: 36px; height: 36px; border-radius: 8px;
  background: none; border: none; color: var(--muted);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: background .15s, color .15s;
}
.btn-icon-sm:hover { background: var(--sidebar-hover); color: var(--text); }

.sidebar-label {
  padding: 4px 20px 2px;
  font-size: 11px; font-weight: 600; color: var(--muted);
  letter-spacing: .06em; text-transform: uppercase; margin-top: 8px;
}
.sidebar-list {
  flex: 1; overflow-y: auto; padding: 4px 10px;
  scrollbar-width: thin; scrollbar-color: var(--border) transparent;
}
.s-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: 8px; font-size: 13px;
  color: var(--muted); cursor: pointer;
  transition: background .15s, color .15s;
  overflow: hidden;
}
.s-item:hover { background: var(--sidebar-hover); color: var(--text); }
.s-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.sidebar-bottom { padding: 10px; border-top: 1px solid var(--border); }
.user-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px; border-radius: 8px; cursor: pointer;
  transition: background .15s;
}
.user-row:hover { background: var(--sidebar-hover); }
.user-av {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--accent); display: flex; align-items: center;
  justify-content: center; font-size: 13px; font-weight: 700;
  color: white; flex-shrink: 0;
}
.user-info { flex: 1; min-width: 0; }
.u-email {
  font-size: 13px; font-weight: 500; color: var(--text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.u-role { font-size: 11px; color: var(--muted); }
.btn-logout {
  background: none; border: none; color: var(--muted);
  padding: 4px; border-radius: 4px; display: flex; align-items: center;
  transition: color .15s;
}
.btn-logout:hover { color: var(--danger); }

/* ── Main ── */
.main {
  flex: 1; min-width: 0;
  display: flex; flex-direction: column;
  background: var(--main);
}

/* Mobile header */
.mob-header {
  display: none; align-items: center; gap: 12px;
  padding: 12px 16px;
  padding-top: calc(12px + env(safe-area-inset-top, 0px));
  border-bottom: 1px solid var(--border);
  background: var(--main); flex-shrink: 0;
}
.mob-title {
  font-size: 15px; font-weight: 600; flex: 1; text-align: center;
  font-family: 'Noto Sans Bengali', 'Inter', sans-serif;
}
.btn-ham {
  width: 36px; height: 36px; border-radius: 8px;
  background: none; border: none; color: var(--muted);
  display: flex; align-items: center; justify-content: center;
  transition: background .15s;
}
.btn-ham:hover { background: var(--surface); color: var(--text); }

/* Messages */
.messages {
  flex: 1; overflow-y: auto; scroll-behavior: smooth;
  scrollbar-width: thin; scrollbar-color: var(--border) transparent;
}
.messages::-webkit-scrollbar { width: 5px; }
.messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

.msg-wrapper {
  padding: 24px 16px; max-width: 760px; margin: 0 auto; width: 100%;
}

/* Welcome */
.welcome-screen {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; min-height: calc(100vh - 180px);
  padding: 40px 20px; text-align: center;
}
.w-logo {
  width: 60px; height: 60px; border-radius: 16px; background: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; margin-bottom: 20px;
}
.w-title {
  font-size: 26px; font-weight: 600; margin-bottom: 10px;
  font-family: 'Noto Sans Bengali', 'Inter', sans-serif;
}
.w-sub {
  font-size: 15px; color: var(--muted); margin-bottom: 32px;
  line-height: 1.6; max-width: 420px;
}
.chip-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 10px; max-width: 560px; width: 100%;
}
.chip-card {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 14px 16px; border-radius: 10px;
  background: var(--surface); border: 1px solid var(--border);
  cursor: pointer; text-align: left;
  transition: background .15s, border-color .15s;
  font-size: 13px; color: var(--text); line-height: 1.4;
  font-family: 'Noto Sans Bengali', 'Inter', sans-serif;
}
.chip-card:hover { background: var(--surface2); border-color: var(--accent); }
.chip-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }

/* Message rows */
.msg-row { display: flex; gap: 16px; margin-bottom: 24px; }
.msg-row.user { flex-direction: row-reverse; }

.m-av {
  width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700; flex-shrink: 0; margin-top: 2px;
}
.msg-row.bot  .m-av { background: var(--accent); color: white; }
.msg-row.user .m-av { background: var(--surface2); color: var(--text); }

.m-body { flex: 1; min-width: 0; }
.msg-row.user .m-body { max-width: 72%; }

.m-name { font-size: 13px; font-weight: 600; margin-bottom: 6px; }

.m-img {
  max-width: 220px; border-radius: 10px; overflow: hidden;
  border: 1px solid var(--border); margin-bottom: 8px;
}
.m-img img { width: 100%; display: block; }

.disease-pill {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(16,163,127,.12); border: 1px solid rgba(16,163,127,.35);
  color: #34d399; border-radius: 999px;
  padding: 4px 12px; font-size: 12px; font-weight: 500;
  margin-bottom: 8px; letter-spacing: .01em;
}

.m-text {
  font-size: 15px; line-height: 1.75; color: var(--text);
  font-family: 'Noto Sans Bengali', 'Inter', sans-serif;
  white-space: pre-wrap; word-break: break-word;
}
.msg-row.user .m-text {
  background: var(--user-bubble); padding: 12px 16px;
  border-radius: 18px 18px 4px 18px; display: inline-block; max-width: 100%;
}

.m-actions {
  display: flex; gap: 4px; margin-top: 8px; opacity: 0;
  transition: opacity .15s;
}
.msg-row:hover .m-actions { opacity: 1; }
.m-act-btn {
  background: none; border: none; color: var(--muted);
  padding: 5px 8px; border-radius: 6px; font-size: 12px;
  display: flex; align-items: center; gap: 5px;
  transition: background .15s, color .15s;
}
.m-act-btn:hover { background: var(--surface); color: var(--text); }

/* Typing */
.typing-row { display: flex; gap: 16px; margin-bottom: 24px; }
.typing-dots {
  display: flex; gap: 5px; padding: 14px 0; align-items: center;
}
.dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--muted);
  animation: bounce 1.3s infinite ease-in-out;
}
.dot:nth-child(2) { animation-delay: .2s; }
.dot:nth-child(3) { animation-delay: .4s; }
@keyframes bounce {
  0%,60%,100% { transform: translateY(0); }
  30%          { transform: translateY(-8px); }
}

/* ── Input area ── */
.input-wrap {
  padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px));
  flex-shrink: 0;
}
.input-inner { max-width: 760px; margin: 0 auto; }

.attach-preview {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px;
}
.attach-preview img {
  width: 44px; height: 44px; object-fit: cover;
  border-radius: 7px; flex-shrink: 0;
}
.a-info { flex: 1; min-width: 0; }
.a-name {
  font-size: 13px; font-weight: 500; color: var(--text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.a-hint { font-size: 11px; color: var(--accent); margin-top: 2px; }
.btn-rm {
  background: none; border: none; color: var(--muted);
  font-size: 20px; padding: 2px; line-height: 1;
  transition: color .15s;
}
.btn-rm:hover { color: var(--danger); }

.input-box {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 12px 14px;
  display: flex; align-items: flex-end; gap: 8px;
  transition: border-color .15s;
}
.input-box:focus-within { border-color: #555; }
.input-box textarea {
  flex: 1; min-width: 0; background: none; border: none;
  outline: none; color: var(--text); font-size: 15px;
  line-height: 1.6; resize: none; max-height: 160px;
  overflow-y: auto; scrollbar-width: none;
  font-family: 'Noto Sans Bengali', 'Inter', sans-serif;
}
.input-box textarea::-webkit-scrollbar { display: none; }
.input-box textarea::placeholder { color: var(--muted); }

.input-btns { display: flex; gap: 4px; align-items: center; flex-shrink: 0; }

.btn-attach {
  width: 34px; height: 34px; border-radius: 8px;
  background: none; border: none; color: var(--muted);
  display: flex; align-items: center; justify-content: center;
  transition: background .15s, color .15s;
}
.btn-attach:hover { background: var(--surface2); color: var(--text); }

.btn-send {
  width: 34px; height: 34px; border-radius: 8px;
  background: var(--accent); border: none; color: white;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s, opacity .15s;
}
.btn-send:hover:not(:disabled) { background: var(--accent-hover); }
.btn-send:disabled { background: var(--surface2); cursor: not-allowed; }

.input-hint {
  text-align: center; font-size: 11px; color: var(--muted); margin-top: 10px;
}

#file-input { display: none; }

/* Toast */
.toast {
  position: fixed; bottom: 100px; left: 50%;
  transform: translateX(-50%);
  background: var(--surface2); color: var(--text);
  padding: 8px 18px; border-radius: 8px; font-size: 13px;
  opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 999;
}
.toast.show { opacity: 1; }

/* Mobile */
@media (max-width: 768px) {
  .sidebar {
    position: fixed; left: 0; top: 0; bottom: 0;
    transform: translateX(-100%);
    box-shadow: 4px 0 20px rgba(0,0,0,.4);
  }
  .sidebar.open { transform: translateX(0); }
  .mob-header { display: flex; }
  .msg-wrapper { padding: 16px 12px; }
  .chip-grid { grid-template-columns: 1fr; max-width: 100%; }
  .w-title { font-size: 20px; }
  .msg-row.user .m-body { max-width: 85%; }
}
</style>
</head>
<body>

<div class="toast" id="toast">Copied!</div>

<!-- ══════════ LOGIN ══════════ -->
<div id="loginPage" class="login-page">
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-icon">🌿</div>
      <div class="brand-name">ফসলের ডাক্তার</div>
      <div class="brand-sub">AI Crop Disease Detection</div>
    </div>
    <div class="login-title">Welcome back</div>
    <div class="field">
      <label>Email address</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="username">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn-login" id="loginBtn" onclick="doLogin()">Continue</button>
    <div class="login-err" id="loginErr" hidden></div>
  </div>
</div>

<!-- ══════════ APP ══════════ -->
<div id="app" class="app" hidden>

  <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <button class="btn-new-chat" onclick="newChat()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        New chat
      </button>
      <button class="btn-icon-sm" onclick="closeSidebar()" title="Close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <div class="sidebar-label">Recent</div>
    <div class="sidebar-list" id="historyList"></div>

    <div class="sidebar-bottom">
      <div class="user-row">
        <div class="user-av" id="userAv">A</div>
        <div class="user-info">
          <div class="u-email" id="uEmail">user@example.com</div>
          <div class="u-role" id="uRole">Farmer</div>
        </div>
        <button class="btn-logout" onclick="doLogout()" title="Log out">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="mob-header">
      <button class="btn-ham" onclick="openSidebar()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="mob-title">ফসলের ডাক্তার</div>
      <button class="btn-ham" onclick="newChat()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      </button>
    </div>

    <div class="messages" id="messages">
      <div id="welcomeScreen" class="welcome-screen">
        <div class="w-logo">🌿</div>
        <div class="w-title">ফসলের ডাক্তার</div>
        <div class="w-sub">আপনার ফসলের রোগ চিহ্নিত করুন। ছবি আপলোড করুন অথবা প্রশ্ন করুন।</div>
        <div class="chip-grid">
          <button class="chip-card" onclick="quickAsk('আমার ধানের পাতায় বাদামী দাগ হচ্ছে, কী করা উচিত?')">
            <span class="chip-icon">🌾</span><span>ধানের পাতায় বাদামী দাগ</span>
          </button>
          <button class="chip-card" onclick="quickAsk('গমে হলুদ মরিচা রোগ দেখা যাচ্ছে')">
            <span class="chip-icon">🌿</span><span>গমে হলুদ মরিচা রোগ</span>
          </button>
          <button class="chip-card" onclick="quickAsk('আমার আলুর পাতা কালো হয়ে মরে যাচ্ছে')">
            <span class="chip-icon">🥔</span><span>আলুর পাতা কালো হওয়া</span>
          </button>
          <button class="chip-card" onclick="quickAsk('ভুট্টা গাছে কমলা রঙের মরিচা, চিকিৎসা কী?')">
            <span class="chip-icon">🌽</span><span>ভুট্টার কমলা মরিচা</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Input -->
    <div class="input-wrap">
      <div class="input-inner">
        <div class="attach-preview" id="attachPreview" hidden>
          <img id="attachThumb" src="" alt="">
          <div class="a-info">
            <div class="a-name" id="attachName">photo.jpg</div>
            <div class="a-hint">🔍 AI রোগ শনাক্ত করবে</div>
          </div>
          <button class="btn-rm" onclick="removeAttach()">×</button>
        </div>
        <div class="input-box">
          <textarea id="msgInput" rows="1"
            placeholder="আপনার ফসলের সমস্যা লিখুন..."
            onkeydown="handleKey(event)"
            oninput="autoResize(this); updateSend();"
          ></textarea>
          <div class="input-btns">
            <button class="btn-attach" onclick="document.getElementById('file-input').click()" title="Upload leaf photo">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            </button>
            <button class="btn-send" id="sendBtn" onclick="sendMessage()" disabled>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
          </div>
        </div>
        <div class="input-hint">ফসলের ছবি আপলোড করুন অথবা সমস্যা লিখুন</div>
      </div>
    </div>
  </main>
</div>

<input type="file" id="file-input" accept="image/*" onchange="onFile(event)">

<script>
const API = 'http://localhost:8000';

let token = '';
let userInfo = { email: '', role: '' };
let history = [];
let attachedFile = null;
let isLoading = false;
let chatSessions = [];

(function init() {
  try {
    token = localStorage.getItem('fd_token') || '';
    userInfo = JSON.parse(localStorage.getItem('fd_user') || '{}');
    chatSessions = JSON.parse(localStorage.getItem('fd_sessions') || '[]');
  } catch(e) {}
  if (token) showApp();
})();

function updateSend() {
  const v = document.getElementById('msgInput').value.trim();
  document.getElementById('sendBtn').disabled = !v && !attachedFile;
}

/* ── Auth ── */
async function doLogin() {
  const email = document.getElementById('email').value.trim();
  const pw = document.getElementById('password').value;
  const btn = document.getElementById('loginBtn');
  document.getElementById('loginErr').hidden = true;

  if (!email || !pw) { showLoginErr('Email এবং password দিন।'); return; }
  btn.disabled = true; btn.textContent = 'Signing in…';

  try {
    const r = await fetch(`${API}/api/v1/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: pw })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || 'Login failed');
    token = d.access_token;
    try {
      const payload = JSON.parse(atob(token.split('.')[1]));
      userInfo = { email: payload.sub || email, role: payload.role || 'user' };
    } catch(e) { userInfo = { email, role: 'user' }; }
    try {
      localStorage.setItem('fd_token', token);
      localStorage.setItem('fd_user', JSON.stringify(userInfo));
    } catch(e) {}
    showApp();
  } catch(e) {
    showLoginErr(e.message || 'সংযোগ ব্যর্থ হয়েছে। Backend চালু আছে কিনা দেখুন।');
    btn.disabled = false; btn.textContent = 'Continue';
  }
}

function showLoginErr(msg) {
  const el = document.getElementById('loginErr');
  el.textContent = msg; el.hidden = false;
}

function doLogout() {
  token = ''; history = []; attachedFile = null;
  try { localStorage.removeItem('fd_token'); } catch(e) {}
  document.getElementById('app').hidden = true;
  document.getElementById('loginPage').hidden = false;
  document.getElementById('loginErr').hidden = true;
  document.getElementById('password').value = '';
}

function showApp() {
  document.getElementById('loginPage').hidden = true;
  document.getElementById('app').hidden = false;
  document.getElementById('uEmail').textContent = userInfo.email || 'User';
  document.getElementById('uRole').textContent = userInfo.role === 'admin' ? 'Admin' : 'Farmer';
  document.getElementById('userAv').textContent = (userInfo.email || 'U')[0].toUpperCase();
  renderHistory();
}

/* ── Sidebar ── */
function openSidebar() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('overlay').classList.add('show');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}

function renderHistory() {
  const list = document.getElementById('historyList');
  list.innerHTML = '';
  chatSessions.slice().reverse().slice(0, 20).forEach(s => {
    const el = document.createElement('div');
    el.className = 's-item';
    el.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;opacity:.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>${s.title}</span>`;
    list.appendChild(el);
  });
}

/* ── New chat ── */
function newChat() {
  history = []; attachedFile = null; removeAttach();
  document.getElementById('messages').innerHTML = '';
  document.getElementById('messages').appendChild(buildWelcome());
  closeSidebar();
}

function buildWelcome() {
  const el = document.createElement('div');
  el.id = 'welcomeScreen'; el.className = 'welcome-screen';
  el.innerHTML = `
    <div class="w-logo">🌿</div>
    <div class="w-title">ফসলের ডাক্তার</div>
    <div class="w-sub">আপনার ফসলের রোগ চিহ্নিত করুন। ছবি আপলোড করুন অথবা প্রশ্ন করুন।</div>
    <div class="chip-grid">
      <button class="chip-card" onclick="quickAsk('আমার ধানের পাতায় বাদামী দাগ হচ্ছে, কী করা উচিত?')">
        <span class="chip-icon">🌾</span><span>ধানের পাতায় বাদামী দাগ</span>
      </button>
      <button class="chip-card" onclick="quickAsk('গমে হলুদ মরিচা রোগ দেখা যাচ্ছে')">
        <span class="chip-icon">🌿</span><span>গমে হলুদ মরিচা রোগ</span>
      </button>
      <button class="chip-card" onclick="quickAsk('আমার আলুর পাতা কালো হয়ে মরে যাচ্ছে')">
        <span class="chip-icon">🥔</span><span>আলুর পাতা কালো হওয়া</span>
      </button>
      <button class="chip-card" onclick="quickAsk('ভুট্টা গাছে কমলা রঙের মরিচা, চিকিৎসা কী?')">
        <span class="chip-icon">🌽</span><span>ভুট্টার কমলা মরিচা</span>
      </button>
    </div>`;
  return el;
}

/* ── File ── */
function onFile(e) {
  const file = e.target.files[0]; if (!file) return;
  attachedFile = file;
  document.getElementById('attachThumb').src = URL.createObjectURL(file);
  document.getElementById('attachName').textContent = file.name;
  document.getElementById('attachPreview').hidden = false;
  document.getElementById('sendBtn').disabled = false;
  e.target.value = '';
}

function removeAttach() {
  attachedFile = null;
  document.getElementById('attachPreview').hidden = true;
  document.getElementById('attachThumb').src = '';
  updateSend();
}

/* ── Send ── */
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 160) + 'px';
}

async function sendMessage() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if ((!text && !attachedFile) || isLoading) return;

  isLoading = true;
  document.getElementById('sendBtn').disabled = true;

  const ws = document.getElementById('welcomeScreen');
  if (ws) ws.remove();

  const file = attachedFile;
  const userText = text;
  input.value = ''; input.style.height = 'auto';
  removeAttach();

  appendUserMsg(userText, file);
  history.push({ role: 'user', content: userText || '📷 ছবি' });

  const typingId = appendTyping();

  try {
    const fd = new FormData();
    fd.append('message', userText);
    fd.append('history', JSON.stringify(history.slice(0, -1)));
    if (file) fd.append('image', file, file.name);

    const res = await fetch(`${API}/api/v1/chat/`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${token}` },
      body: fd
    });

    removeEl(typingId);

    if (res.status === 401) { doLogout(); return; }
    if (!res.ok) {
      const er = await res.json().catch(() => ({}));
      throw new Error(er.detail || `Error ${res.status}`);
    }

    const data = await res.json();
    appendBotMsg(data);
    history.push({ role: 'assistant', content: data.reply });

    if (history.length === 2) {
      chatSessions.push({ title: (userText || 'Image chat').slice(0, 42), ts: Date.now() });
      try { localStorage.setItem('fd_sessions', JSON.stringify(chatSessions)); } catch(e) {}
      renderHistory();
    }
  } catch(e) {
    removeEl(typingId);
    appendBotMsg({ reply: `⚠️ সমস্যা হয়েছে: ${e.message}`, sources_used: false });
  }

  isLoading = false;
  updateSend();
  scrollBottom();
}

function quickAsk(text) {
  document.getElementById('msgInput').value = text;
  document.getElementById('sendBtn').disabled = false;
  sendMessage();
}

/* ── DOM builders ── */
function appendUserMsg(text, file) {
  const wrap = mk('div', 'msg-wrapper');
  const row = mk('div', 'msg-row user');
  const av = mk('div', 'm-av');
  av.textContent = (userInfo.email || 'U')[0].toUpperCase();
  const body = mk('div', 'm-body');

  if (file) {
    const imgBox = mk('div', 'm-img');
    const img = document.createElement('img');
    img.src = URL.createObjectURL(file);
    imgBox.appendChild(img); body.appendChild(imgBox);
  }
  if (text) {
    const t = mk('div', 'm-text'); t.textContent = text; body.appendChild(t);
  }

  row.appendChild(body); row.appendChild(av);
  wrap.appendChild(row); msgs().appendChild(wrap);
  scrollBottom();
}

function appendBotMsg(data) {
  const wrap = mk('div', 'msg-wrapper');
  const row = mk('div', 'msg-row bot');
  const av = mk('div', 'm-av'); av.textContent = '🌿';
  const body = mk('div', 'm-body');

  const name = mk('div', 'm-name'); name.textContent = 'ফসলের ডাক্তার';
  body.appendChild(name);

  if (data.disease_detected) {
    const pill = mk('div', 'disease-pill');
    const conf = data.confidence ? ` · ${(data.confidence * 100).toFixed(0)}%` : '';
    pill.textContent = `🔬 ${data.disease_detected.replace(/_/g, ' ')}${conf}`;
    body.appendChild(pill);
  }

  const t = mk('div', 'm-text'); t.textContent = data.reply;
  body.appendChild(t);

  const acts = mk('div', 'm-actions');
  const copyBtn = mk('button', 'm-act-btn');
  copyBtn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy`;
  copyBtn.onclick = () => {
    navigator.clipboard.writeText(data.reply).then(() => showToast('Copied!')).catch(() => {});
  };
  acts.appendChild(copyBtn); body.appendChild(acts);

  row.appendChild(av); row.appendChild(body);
  wrap.appendChild(row); msgs().appendChild(wrap);
}

function appendTyping() {
  const id = 'typing-' + Date.now();
  const wrap = mk('div', 'msg-wrapper'); wrap.id = id;
  const row = mk('div', 'typing-row');
  const av = mk('div', 'm-av'); av.style.cssText = 'width:32px;height:32px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;';
  av.textContent = '🌿';
  const dots = mk('div', 'typing-dots');
  for (let i = 0; i < 3; i++) dots.appendChild(mk('div', 'dot'));
  row.appendChild(av); row.appendChild(dots);
  wrap.appendChild(row); msgs().appendChild(wrap);
  scrollBottom(); return id;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

function removeEl(id) { const el = document.getElementById(id); if (el) el.remove(); }
function mk(tag, cls) { const el = document.createElement(tag); el.className = cls; return el; }
function msgs() { return document.getElementById('messages'); }
function scrollBottom() {
  const m = msgs();
  requestAnimationFrame(() => { m.scrollTop = m.scrollHeight; });
}

document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('email').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('password').focus(); });
</script>
</body>
</html>
